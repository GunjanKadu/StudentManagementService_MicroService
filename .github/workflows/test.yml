name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Main dependencies
        run: npm install

      - name: Install Auth Service dependencies
        run: |
          cd authService
          npm install

      - name: Run Auth Service tests
        run: |
          cd authService
          npm test

      - name: Install Student Service dependencies
        run: |
          cd studentService
          npm install

      - name: Run Student Service tests
        run: |
          cd studentService
          npm test

      - name: Upload coverage report (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/auth-service/coverage
