name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Fail if test files are changed
        run: |
          # Fetch the list of changed files between the current branch and main
          CHANGED_FILES=$(git diff --name-only origin/main)

          # Debugging step: Display the changed files for inspection
          echo "Changed files: $CHANGED_FILES"

          # Check if any of the changed files are in the test folder and end with .test.js
          if echo "$CHANGED_FILES" | grep -E '(^|/)test[s]?/.+\.test\.js$'; then
            echo "❌ Changes to test files (e.g., util.test.js) are not allowed!"
            exit 1
          fi

      - name: Install Main dependencies
        run: npm install

      - name: Install Student Service dependencies
        run: |
          cd studentService
          npm install

      - name: Run Student Service tests
        run: |
          cd studentService
          npm test

      - name: Upload coverage report (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/auth-service/coverage
